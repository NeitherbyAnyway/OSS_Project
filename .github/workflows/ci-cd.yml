name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python with pip cache
        id: setup-python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache-pip: "true"

      - name: Install lint dependency and measure cache
        shell: bash
        run: |
          started=$(date +%s%N)
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          elapsed_ms=$(( ($(date +%s%N) - started) / 1000000 ))
          {
            echo "### Dependency cache measurement"
            echo "- Pip cache hit: ${{ steps.setup-python.outputs.cache-hit }}"
            echo "- Dependency install: ${elapsed_ms} ms"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint Python scripts
        run: ruff check --select E4,E7,E9,F --ignore F401,F841 .github/scripts

      - name: Build Pages site
        run: |
          python -m compileall -q .github/scripts
          mkdir -p _site
          cp site/index.html _site/index.html
          cp docs/dora-dashboard.png _site/dora-dashboard.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      runner: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.filter.outputs.pages }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Pages changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            pages:
              - 'site/**'
              - 'docs/dora-dashboard.png'

  deploy:
    needs: [build, test, changes]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.pages == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
